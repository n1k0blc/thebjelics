    <script src="script.js"></script>
    <script>
        // Banner sticky functionality for gallery page - directly implemented
        window.addEventListener('scroll', function() {
          const banner = document.querySelector('.travel-header-row .banner');
          const headerRow = document.querySelector('.travel-header-row');
          
          if (banner && headerRow) {
            const headerRect = headerRow.getBoundingClientRect();
            
            if (headerRect.top <= 0) {
              banner.classList.add('is-fixed');
            } else {
              banner.classList.remove('is-fixed');
            }
          }
        });

        // Scroll to Top Button functionality
        const scrollToTopBtn = document.getElementById('scrollToTop');
        
        // Show/hide button based on scroll position
        window.addEventListener('scroll', function() {
          if (window.pageYOffset > 300) {
            scrollToTopBtn.classList.add('visible');
          } else {
            scrollToTopBtn.classList.remove('visible');
          }
        });
        
        // Scroll to top when button is clicked
        scrollToTopBtn.addEventListener('click', function() {
          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });
        });
    </script>
